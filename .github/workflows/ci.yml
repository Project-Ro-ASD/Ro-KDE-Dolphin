name: Ro-KDE-Dolphin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ro-kde-dolphin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate repository contract
        run: python3 scripts/validate.py

  patches:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: Patches apply to the upstream base tag
        run: bash tests/check-patches.sh
